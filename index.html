function renderTabs() {
    const tabsContainer = document.getElementById('tabs-container');
    tabsContainer.innerHTML = '';
    Object.keys(quizDatabase).forEach((tabName, index) => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = tabName;
        btn.onclick = () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderQuestions(tabName);
        };
        tabsContainer.appendChild(btn);
    });
}

function renderQuestions(tabName) {
    const container = document.getElementById('quiz-container');
    container.innerHTML = '';
    const questions = quizDatabase[tabName];
    
    if (!questions || questions.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#a0aec0; padding:20px;">這個分頁目前還沒有題目喔！</div>';
        return;
    }

    questions.forEach((item, qIdx) => {
        const quizItem = document.createElement('div');
        quizItem.className = 'quiz-item';

        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        qDiv.innerText = `${qIdx + 1}. ${item.q}`;
        quizItem.appendChild(qDiv);

        const optsDiv = document.createElement('div');
        optsDiv.className = 'options';

        const ansDiv = document.createElement('div');
        ansDiv.className = 'analysis';

        item.o.forEach((opt, oIdx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => {
                optsDiv.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct', 'incorrect'));
                if (oIdx === item.c) {
                    btn.classList.add('correct');
                    ansDiv.className = 'analysis show-correct';
                    ansDiv.innerText = `💡 解析：回答正確！`;
                } else {
                    btn.classList.add('incorrect');
                    ansDiv.className = 'analysis show-incorrect';
                    ansDiv.innerText = `❌ 答錯囉！再想想看。`;
                }
            };
            optsDiv.appendChild(btn);
        });

        quizItem.appendChild(optsDiv);
        quizItem.appendChild(ansDiv);
        container.appendChild(quizItem);
    });
}

// 初始化
renderTabs();
const firstTab = Object.keys(quizDatabase)[0];
if (firstTab) {
    renderQuestions(firstTab);
}
